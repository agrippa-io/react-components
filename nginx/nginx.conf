# Main nginx config for the Storybook image (agrippa-web image contract, see
# agrippa-stack deploy/charts/agrippa-web/README.md). Runs as UID 101 with a
# read-only root filesystem: everything nginx writes goes to /tmp.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # Rendered from /etc/nginx/templates/default.conf.template at start-up by
  # the image entrypoint (NGINX_ENVSUBST_OUTPUT_DIR=/tmp), with $PORT filled in.
  include /tmp/default.conf;
}
