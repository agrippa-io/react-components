name: release-stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 0.1.0)'
        required: true
        type: string

jobs:
  # Thin wrapper around the shared release-stage workflow. All the heavy
  # lifting (semver validation, branch cut, package.json bump via contents
  # API, draft promotion PR) happens in
  # agrippa-io/github-actions/.github/workflows/npm-release-stage.yml.
  cut-release-branch:
    uses: agrippa-io/github-actions/.github/workflows/npm-release-stage.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
