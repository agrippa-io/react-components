name: release

on:
  push:
    branches:
      - develop
      - 'release/**'
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-validate on every push to guard against direct pushes, force pushes,
  # and merge-commit-vs-PR-head divergence. Mirrors ci.yml's fan-out.
  format:
    uses: agrippa-io/github-actions/.github/workflows/npm-format.yml@v1
    with:
      npm-scope: '@agrippa-io'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  lint:
    uses: agrippa-io/github-actions/.github/workflows/npm-lint.yml@v1
    with:
      npm-scope: '@agrippa-io'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  test:
    uses: agrippa-io/github-actions/.github/workflows/npm-test.yml@v1
    with:
      npm-scope: '@agrippa-io'
      with-playwright: true
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  build:
    needs: [format, lint, test]
    uses: agrippa-io/github-actions/.github/workflows/npm-build.yml@v1
    with:
      npm-scope: '@agrippa-io'
      with-storybook: true
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  # dev publishes need the PR number + merge SHA in the suffix. Look it up
  # once, output the composed suffix, feed it to npm-publish-prerelease.
  compute-dev-suffix:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      suffix: ${{ steps.compute.outputs.suffix }}
    steps:
      - uses: actions/github-script@v7
        id: compute
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            })
            const pr = data[0]?.number ?? 0
            const sha = (data[0]?.merge_commit_sha ?? context.sha).slice(0, 7)
            core.setOutput('suffix', `dev.${pr}.${sha}`)

  publish-dev:
    if: github.ref == 'refs/heads/develop'
    needs: [build, compute-dev-suffix]
    uses: agrippa-io/github-actions/.github/workflows/npm-publish-prerelease.yml@v1
    with:
      npm-scope: '@agrippa-io'
      dist-tag: dev
      version-suffix: ${{ needs.compute-dev-suffix.outputs.suffix }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  publish-staging:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: build
    uses: agrippa-io/github-actions/.github/workflows/npm-publish-prerelease.yml@v1
    with:
      npm-scope: '@agrippa-io'
      dist-tag: staging
      version-suffix: rc.${{ github.run_number }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  publish-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: agrippa-io/github-actions/.github/workflows/npm-publish-latest.yml@v1
    with:
      npm-scope: '@agrippa-io'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    if: github.ref == 'refs/heads/main'
    needs: publish-prod
    uses: agrippa-io/github-actions/.github/workflows/docker-publish-ecr.yml@v1
    with:
      registry-url: ${{ vars.URL_DOCKER_REGISTRY }}
      aws-region: us-west-1
      tag: ${{ needs.publish-prod.outputs.tag }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      buildkit-secret-value: ${{ secrets.NPM_TOKEN }}

  sync-develop:
    if: github.ref == 'refs/heads/main'
    needs: publish-prod
    uses: agrippa-io/github-actions/.github/workflows/gitflow-sync-back.yml@v1
    with:
      version: ${{ needs.publish-prod.outputs.version }}
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
