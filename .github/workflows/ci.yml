name: ci

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    uses: agrippa-io/github-actions/.github/workflows/npm-format.yml@v1
    with:
      npm-scope: '@agrippa-io'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  lint:
    uses: agrippa-io/github-actions/.github/workflows/npm-lint.yml@v1
    with:
      npm-scope: '@agrippa-io'
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  test:
    uses: agrippa-io/github-actions/.github/workflows/npm-test.yml@v1
    with:
      npm-scope: '@agrippa-io'
      with-playwright: true
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  build:
    needs: [format, lint, test]
    uses: agrippa-io/github-actions/.github/workflows/npm-build.yml@v1
    with:
      npm-scope: '@agrippa-io'
      with-storybook: true
      artifact-name: dist-${{ github.event.pull_request.head.sha }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  publish-canary:
    name: Publish canary to npm
    needs: build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: agrippa-io/github-actions/npm/actions/setup-yarn-project@v1
        with:
          npm-scope: '@agrippa-io'
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute canary version
        id: version
        uses: agrippa-io/github-actions/npm/actions/compute-prerelease-version@v1
        with:
          suffix: canary.${{ steps.sha.outputs.short }}

      - name: Build
        run: yarn build

      - name: 'Publish to npm (dist-tag: canary)'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --access restricted

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}'
            const body = [
              '📦 Canary published to npm',
              '',
              '```bash',
              `yarn add @agrippa-io/react-components@${version}`,
              '# or',
              `npm install @agrippa-io/react-components@canary`,
              '```'
            ].join('\n')
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })

  # Aggregate gate — the single stable check the org branch ruleset requires.
  # Gates on the validation jobs; the canary publish is a side-effect, not a
  # merge gate.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [format, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.format.result }}" = "success" ] \
            && [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ]
