name: ci

on:
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format / Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: agrippa-io/github-actions/npm/actions/setup-yarn-project@dcd6006e782cde6fa2865fd44850d8afe0d37cfd
        with:
          npm-scope: '@agrippa-io'
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Format check
        run: yarn prettier --check 'src/**/*.{ts,tsx}'

      - name: Lint
        run: yarn eslint . --ext .ts,.tsx --max-warnings=0

      - uses: agrippa-io/github-actions/npm/actions/playwright-cached-chromium@dcd6006e782cde6fa2865fd44850d8afe0d37cfd

      - name: Test
        run: yarn vitest run --coverage

      - name: Build
        run: yarn build

      - name: Build Storybook
        run: yarn build:storybook

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.head.sha }}
          path: dist/
          retention-days: 7

  publish-canary:
    name: Publish canary to npm
    needs: validate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: agrippa-io/github-actions/npm/actions/setup-yarn-project@dcd6006e782cde6fa2865fd44850d8afe0d37cfd
        with:
          npm-scope: '@agrippa-io'
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute canary version
        id: version
        uses: agrippa-io/github-actions/npm/actions/compute-prerelease-version@dcd6006e782cde6fa2865fd44850d8afe0d37cfd
        with:
          suffix: canary.${{ steps.sha.outputs.short }}

      - name: Build
        run: yarn build

      - name: 'Publish to npm (dist-tag: canary)'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag canary --access restricted

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}'
            const body = [
              '📦 Canary published to npm',
              '',
              '```bash',
              `yarn add @agrippa-io/react-components@${version}`,
              '# or',
              `npm install @agrippa-io/react-components@canary`,
              '```'
            ].join('\n')
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
